[project]
name = "spec-tool"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]          # ← WICHTIG: macht src/ importierbar OHNE Installation
markers = [
    "unit: Unit-Tests",
    "integration: Integrationstests",
    "e2e: End-to-End-Tests gegen echte Dateien",
]

[tool.coverage.run]
source = ["src/spec_tool"]

[tool.coverage.report]
fail_under = 80