[project]
name = "spec-tool"
version = "0.2.0"
description = "Parser, Validator und View-Generator für strukturierte Spezifikationsdokumente"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
spec-tool = "spec_tool.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"  # <-- Make sure this is exactly 'setuptools.build_meta'

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit-Tests",
    "integration: Integrationstests",
    "e2e: End-to-End-Tests",
]

[tool.coverage.run]
source = ["src/spec_tool"]

[tool.coverage.report]
fail_under = 80